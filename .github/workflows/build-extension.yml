name: Build browser extensions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate manifests
        shell: bash
        run: |
          jq --exit-status '.manifest_version == 3' manifest.json >/dev/null
          jq --exit-status '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' manifest.json >/dev/null
          jq --exit-status '.background.service_worker == "src/background.js"' manifest.json >/dev/null
          jq --exit-status '.background | has("scripts") | not' manifest.json >/dev/null
          jq --exit-status 'has("browser_specific_settings") | not' manifest.json >/dev/null

          jq --exit-status '.manifest_version == 3' manifest.firefox.json >/dev/null
          jq --exit-status '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' manifest.firefox.json >/dev/null
          jq --exit-status '.background.scripts == ["src/background.js"]' manifest.firefox.json >/dev/null
          jq --exit-status '.background | has("service_worker") | not' manifest.firefox.json >/dev/null
          jq --exit-status '.browser_specific_settings.gecko.id | length > 0' manifest.firefox.json >/dev/null

          test "$(jq --raw-output '.version' manifest.json)" = "$(jq --raw-output '.version' manifest.firefox.json)"
          jq --slurp --exit-status '
            (.[0] | del(.background, .browser_specific_settings, .minimum_chrome_version)) ==
            (.[1] | del(.background, .browser_specific_settings, .minimum_chrome_version))
          ' manifest.json manifest.firefox.json >/dev/null

      - name: Check JavaScript syntax
        shell: bash
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Package extensions
        shell: bash
        run: |
          mkdir -p dist/chrome dist/firefox
          for browser in chrome firefox; do
            cp README.md LICENSE "dist/$browser/"
            cp -R src "dist/$browser/"
          done
          cp manifest.json dist/chrome/manifest.json
          cp manifest.firefox.json dist/firefox/manifest.json
          (cd dist/chrome && zip -r ../finn-plus-chrome.zip .)
          (cd dist/firefox && zip -r ../finn-plus-firefox.zip .)

      - name: Validate Firefox extension
        run: npx --yes web-ext@10.6.0 lint --source-dir dist/firefox

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v7
        with:
          name: finn-plus-chrome-${{ github.sha }}
          path: dist/finn-plus-chrome.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v7
        with:
          name: finn-plus-firefox-${{ github.sha }}
          path: dist/finn-plus-firefox.zip
          if-no-files-found: error
          retention-days: 30
